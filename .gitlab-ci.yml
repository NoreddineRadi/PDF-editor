# Variables CI/CD à définir (Settings > CI/CD > Variables, "Protected" + "Masked" si possible) :
#   VITE_PRIMEVUE_LICENCE : licence PrimeVue (n'est plus dans le dépôt)
#   VPS_USER              : cible SSH au format utilisateur@hôte
#   SSH_PRIVATE_KEY       : clé privée de déploiement (type "Variable")
#   SSH_KNOWN_HOSTS       : sortie de `ssh-keyscan <hôte>` vérifiée une fois à la main (empreinte épinglée)

stages:
  - build
  - deploy

build:
  stage: build
  image: node:24

  before_script:
    - corepack enable
    - yarn --version

  script:
    - yarn install --immutable
    - yarn build

  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

deploy:
  stage: deploy
  image: alpine:3.20

  dependencies:
    - build

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

  script:
    # --delete supprime les anciens fichiers hashés devenus inutiles
    - rsync -az --delete dist/ "$VPS_USER:/var/www/pdf-editor/"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
