stages:
  - build
  - deploy

build:
  stage: build

  script:
    - yarn install --immutable
    - yarn build

  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

deploy:
  stage: deploy

  dependencies:
    - build

  script:
    - apt-get update -y && apt-get install -y sshpass
    - mkdir -p ~/.ssh
    - ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

    - sshpass -p "$VPS_PASSWORD" scp -r dist/* "$VPS_USER@$VPS_HOST:/root/apps/pdf-editor/"

  only:
    - main