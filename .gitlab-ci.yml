stages:
  - build
  - deploy

build:
  stage: build
  image: node:24

  before_script:
  - corepack enable
  - yarn --version

  script:
    - yarn install --immutable
    - yarn build

  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

deploy:
  stage: deploy

  dependencies:
    - build
  before_script:
  - mkdir -p ~/.ssh
  - VPS_HOST="${VPS_USER#*@}"
  - ssh-keyscan "$VPS_HOST" >> ~/.ssh/known_hosts

  script:
    - apt-get update -y && apt-get install -y sshpass
    - sshpass -p "$VPS_PASSWORD" scp -r dist/* "$VPS_USER:/root/apps/pdf-editor/"

  only:
    - main