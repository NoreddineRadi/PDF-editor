name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack and check Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install dependencies and build
        run: |
          yarn install --immutable
          yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1 # Le minimum sur GitHub est 1 jour

  deploy:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Install SSH, sshpass and rsync
        run: apk add --no-cache openssh-client sshpass rsync

      - name: Deploy via rsync with password
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sshpass -e rsync -az -e "ssh -p 2222" --delete dist/ "$VPS_USER:/var/www/pdf-editor/"

