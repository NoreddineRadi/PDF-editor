name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack and check Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install dependencies and build
        run: |
          yarn install --immutable
          yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1 # Le minimum sur GitHub est 1 jour

  deploy:
    needs: build # Équivalent de "dependencies: [build]"
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Install SSH and rsync
        run: apk add --no-cache openssh-client rsync

      - name: Setup SSH and deploy via rsync
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          rsync -az --delete dist/ "$VPS_USER:/var/www/pdf-editor/"
